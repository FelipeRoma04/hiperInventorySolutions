version: '3.8'

services:

  # ── SQL Server 2022 ──────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hiper-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SQL_SERVER_PASSWORD:-HiperApp2024!}
      MSSQL_PID: "Express"
    ports:
      - "${SQL_SERVER_PORT:-1434}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - hiper-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd",
             "-S", "localhost", "-U", "sa", "-P", "${SQL_SERVER_PASSWORD:-HiperApp2024!}",
             "-Q", "SELECT 1", "-C", "-N"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── DB Init (runs schema once) ───────────────────────────
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hiper-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./sql:/sql:ro
    networks:
      - hiper-network
    environment:
      SA_PASSWORD: ${SQL_SERVER_PASSWORD:-HiperApp2024!}
    command: >
      bash -c "
        echo 'Waiting for SQL Server to be ready...' &&
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P $${SA_PASSWORD} -C -N -i /sql/create_database.sql &&
        echo '✅ Database schema initialized successfully.'
      "
    restart: "no"

  # ── Tomcat App ───────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiper-app
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: ${DB_HOST:-sqlserver}
      DB_PORT: ${DB_PORT:-1433}
      DB_NAME: ${DB_NAME:-hiperInventorySolutions}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-HiperApp2024!}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -Dfile.encoding=UTF-8}
    ports:
      - "${APP_PORT:-8081}:8080"
    volumes:
      - app_logs:/usr/local/tomcat/logs
    networks:
      - hiper-network
    restart: unless-stopped

networks:
  hiper-network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
  app_logs:
    driver: local
